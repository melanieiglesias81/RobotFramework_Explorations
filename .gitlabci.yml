stages:
  - test

robot_framework_tests:
  stage: test
  image: python:3.11-slim

  before_script:
    - apt-get update && apt-get install -y wget curl unzip gnupg
    - wget -q -O - https://google.com | apt-key add -
    - echo "deb [arch=amd64] http://google.com stable main" >> /etc/directory/sources.list.d/google.list
    - apt-get update && apt-get install -y google-chrome-stable

    - python -m pip install --upgrade pip
    - pip3 install robotframework robotframework-seleniumlibrary webdriver-manager

  script:
    - robot --variable BROWSER:headlesschrome tests/

  artifacts:
    when: always
    paths:
      - report.html
      - log.html
      - output.xml
    expire_in: 1 week
