## Base Image ##
image: alpine:3.19

## Stages ##
stages:
  - Test Execution

## Common Variables ##
variables:
  PROJECTS:
    description: Select from the available projects to run automated tests
    value: "Sample1_Project"
    options:
      - "Sample1_Project"
      - "Sample2_Project"
  FEATURE:
    description: Robot Framework tag to run (passed to -i)
    value: "BasicTest"
    options:
      - "smoke"
      - "BasicTest"
      - "Login"

  TEST_PATH: ${PROJECTS}/tests/web/tests
  RESULTS_PATH: ${PROJECTS}/tests/web/results

## Hidden Templates ##
.install_package:
  before_script:
    - apk --quiet --no-cache add
        gcc g++ libffi-dev linux-headers musl-dev openssl-dev
        jq python3 python3-dev py3-pip curl zip unzip
        chromium chromium-chromedriver
    - python3 -m venv /venv
    - . /venv/bin/activate
    - pip install --quiet --no-cache-dir --upgrade pip
    - >
      pip install --quiet --no-cache-dir
      requests==2.26.0
      urllib3==1.26.20
      robotframework==7.0.1
      robotframework-seleniumlibrary==5.1.3
      robotframework-sshlibrary==3.8.0
      selenium==4.9.0
      robotframework-databaselibrary==2.0.4
      robotframework-datadriver==1.11.2
      pymysql
      pyyaml
      robotframework-faker==5.0.0
      robotframework-requests==0.9.7
      axe-selenium-python==2.1.6
      python-dateutil

.test_common:
  artifacts:
    when: always
    paths:
      - ${RESULTS_PATH}
    expire_in: 1 week

.singlefeatures_common:
  script:
    - echo -e "\e[34m=======================================================\e[0m"
    - echo "Executing Test"
    - robot -d ${RESULTS_PATH} -i ${FEATURE} ${TEST_PATH}
    ## With an env file: robot -V env.${ENV_NO}.yaml -d ${RESULTS_PATH} -i ${FEATURE} ${TEST_PATH}
    ## Single file:      robot Sample1_Project/tests/web/tests/BasicTest.robot

## Jobs ##
run_tests:
  stage: Test Execution
  extends:
    - .install_package
    - .test_common
    - .singlefeatures_common
